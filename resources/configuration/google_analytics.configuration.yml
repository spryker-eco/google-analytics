# yaml-language-server: $schema=../../../../Spryker/Configuration/resources/configuration/configuration-schema-v1.json
features:
    - key: integrations
      name: Integrations
      description: Third-party integrations configuration.
      enabled: true
      order: 100
      tabs:
          - key: google_analytics
            name: Google Analytics
            description: Google Analytics 4 integration settings. Used for search statistics.
            enabled: true
            order: 0
            sections:
                - key: event_tracking
                  name: Event Tracking
                  description: Storefront events sent to Google Analytics 4. A disabled event is not tracked.
            groups:
                - key: tracking
                  name: Storefront Tracking
                  description: Storefront tracking configuration for GA4 using gtag.js.
                  enabled: true
                  order: 0
                  scopes:
                      - global
                      - store
                  settings:
                      - key: measurement_id
                        name: Measurement ID
                        description: >
                            GA4 Measurement ID (format: G-XXXXXXXXXX) used by the Google tag on the storefront.
                            Documentation: https://support.google.com/analytics/answer/9539598
                        type: string
                        default_value: ''
                        placeholder: 'G-xxxxxxx'
                        enabled: true
                        secret: false
                        storefront: true
                        order: 1
                        scopes:
                            - global
                            - store
                        constraints:
                            - type: regex
                              message: 'Must be a valid key (starts with G- and has min 6 symbols after -).'
                              options:
                                  pattern: '^G-[A-Za-z0-9]{6,}$'
                - key: connection
                  name: Data API Connection
                  description: Connection settings for the Google Analytics Data API (GA4).
                  enabled: true
                  order: 1
                  scopes:
                      - global
                  settings:
                      - key: property_id
                        name: Property ID
                        description: >
                            GA4 numeric property ID (e.g. 123456789).
                            Documentation: https://developers.google.com/analytics/devguides/reporting/data/v1/property-id
                        type: string
                        default_value: ''
                        enabled: true
                        secret: false
                        storefront: false
                        order: 0
                        scopes:
                            - global
                      - key: service_account_credentials_json
                        name: Service Account Credentials JSON
                        description: >
                            Full JSON content of the Google Cloud service account key. Stored encrypted.
                            Documentation: https://docs.cloud.google.com/iam/docs/keys-create-delete
                        type: text
                        default_value: ''
                        enabled: true
                        secret: true
                        storefront: false
                        order: 1
                        scopes:
                            - global
                        constraints:
                            - type: 'SprykerEco\Zed\GoogleAnalytics\Communication\Constraint\GoogleAnalyticsCredentialsJsonFormatConstraint'
                - key: product_events
                  name: Product Events
                  description: Product discovery and interaction events.
                  section: event_tracking
                  toggle_all: true
                  layout: compact
                  enabled: true
                  order: 2
                  scopes:
                      - global
                      - store
                  settings:
                      - key: view_item_event_enabled
                        name: View Item
                        description: 'A product detail page is opened. GA4 event: view_item.'
                        type: boolean
                        default_value: false
                        enabled: true
                        secret: false
                        storefront: true
                        order: 0
                        scopes:
                            - global
                            - store
                      - key: view_item_list_event_enabled
                        name: View Item List
                        description: 'A category or search results page with products is shown. GA4 event: view_item_list.'
                        type: boolean
                        default_value: false
                        enabled: true
                        secret: false
                        storefront: true
                        order: 1
                        scopes:
                            - global
                            - store
                      - key: select_item_event_enabled
                        name: Select Item
                        description: 'A product is clicked in a category or search results list. GA4 event: select_item.'
                        type: boolean
                        default_value: false
                        enabled: true
                        secret: false
                        storefront: true
                        order: 2
                        scopes:
                            - global
                            - store
                      - key: search_event_enabled
                        name: Search
                        description: 'Storefront search is performed. GA4 events: search_results, zero_search_results.'
                        type: boolean
                        default_value: false
                        enabled: true
                        secret: false
                        storefront: true
                        order: 3
                        scopes:
                            - global
                            - store
                      - key: product_configurator_used_event_enabled
                        name: Product Configurator Used
                        description: 'Product configurator is used. GA4 event: product_configurator_used.'
                        type: boolean
                        default_value: false
                        enabled: true
                        secret: false
                        storefront: true
                        order: 4
                        scopes:
                            - global
                            - store
                - key: cart_events
                  name: Cart Events
                  description: Cart interaction events.
                  section: event_tracking
                  toggle_all: true
                  layout: compact
                  enabled: true
                  order: 3
                  scopes:
                      - global
                      - store
                  settings:
                      - key: add_to_cart_event_enabled
                        name: Add to Cart
                        description: 'A product is added to the cart, or a cart item quantity is raised. GA4 event: add_to_cart.'
                        type: boolean
                        default_value: false
                        enabled: true
                        secret: false
                        storefront: true
                        order: 0
                        scopes:
                            - global
                            - store
                      - key: remove_from_cart_event_enabled
                        name: Remove from Cart
                        description: 'A product is removed from the cart, or a cart item quantity is lowered. GA4 event: remove_from_cart.'
                        type: boolean
                        default_value: false
                        enabled: true
                        secret: false
                        storefront: true
                        order: 1
                        scopes:
                            - global
                            - store
                      - key: view_cart_event_enabled
                        name: View Cart
                        description: 'The customer opens the cart page with at least one product; a reload, the Back button and the return to the cart after a cart change are not counted. GA4 event: view_cart.'
                        type: boolean
                        default_value: false
                        enabled: true
                        secret: false
                        storefront: true
                        order: 2
                        scopes:
                            - global
                            - store
                      - key: reorder_event_enabled
                        name: Reorder
                        description: 'Previous order is reordered. GA4 event: reorder.'
                        type: boolean
                        default_value: false
                        enabled: true
                        secret: false
                        storefront: true
                        order: 3
                        scopes:
                            - global
                            - store
                      - key: bulk_order_upload_event_enabled
                        name: Bulk Order Upload
                        description: 'Products are added to the cart in bulk (quick order, file upload). GA4 event: bulk_order_upload.'
                        type: boolean
                        default_value: false
                        enabled: true
                        secret: false
                        storefront: true
                        order: 4
                        scopes:
                            - global
                            - store
                - key: customer_list_events
                  name: Customer List Events
                  description: Shopping list and wishlist events.
                  section: event_tracking
                  toggle_all: true
                  layout: compact
                  enabled: true
                  order: 4
                  scopes:
                      - global
                      - store
                  settings:
                      - key: add_to_shopping_list_event_enabled
                        name: Add to Shopping List
                        description: 'Product is added to a shopping list. GA4 event: add_to_shopping_list.'
                        type: boolean
                        default_value: false
                        enabled: true
                        secret: false
                        storefront: true
                        order: 0
                        scopes:
                            - global
                            - store
                      - key: create_shopping_list_event_enabled
                        name: Create Shopping List
                        description: 'Shopping list is created. GA4 event: create_shopping_list.'
                        type: boolean
                        default_value: false
                        enabled: true
                        secret: false
                        storefront: true
                        order: 1
                        scopes:
                            - global
                            - store
                      - key: add_to_wishlist_event_enabled
                        name: Add to Wishlist
                        description: 'A product is added to a wishlist, on the product detail page or as an alternative on the wishlist page. GA4 event: add_to_wishlist.'
                        type: boolean
                        default_value: false
                        enabled: true
                        secret: false
                        storefront: true
                        order: 2
                        scopes:
                            - global
                            - store
                - key: checkout_events
                  name: Checkout Events
                  description: Checkout funnel events.
                  section: event_tracking
                  toggle_all: true
                  layout: compact
                  enabled: true
                  order: 5
                  scopes:
                      - global
                      - store
                  settings:
                      - key: begin_checkout_event_enabled
                        name: Begin Checkout
                        description: 'The customer clicks the checkout button and the first checkout step opens; moving between steps, reloading a step and a checkout the shop does not start are not counted. GA4 event: begin_checkout.'
                        type: boolean
                        default_value: false
                        enabled: true
                        secret: false
                        storefront: true
                        order: 0
                        scopes:
                            - global
                            - store
                      - key: add_shipping_info_event_enabled
                        name: Add Shipping Info
                        description: 'The customer submits the shipment step and the next step opens; continuing with the same shipment method, reloading a step and a shipment step shown again with errors are not counted. A split delivery sends its methods together. GA4 event: add_shipping_info.'
                        type: boolean
                        default_value: false
                        enabled: true
                        secret: false
                        storefront: true
                        order: 1
                        scopes:
                            - global
                            - store
                      - key: add_payment_info_event_enabled
                        name: Add Payment Info
                        description: 'The customer submits the payment step and the next step opens; continuing with the same payment method, reloading a step and a payment step shown again with errors are not counted. Only the method name is sent, never payment details. GA4 event: add_payment_info.'
                        type: boolean
                        default_value: false
                        enabled: true
                        secret: false
                        storefront: true
                        order: 2
                        scopes:
                            - global
                            - store
                      - key: purchase_event_enabled
                        name: Purchase
                        description: 'An order is placed; reported once per order. GA4 event: purchase.'
                        type: boolean
                        default_value: false
                        enabled: true
                        secret: false
                        storefront: true
                        order: 3
                        scopes:
                            - global
                            - store
                - key: quote_events
                  name: Quote Events
                  description: Quote request and quote approval events.
                  section: event_tracking
                  toggle_all: true
                  layout: compact
                  enabled: true
                  order: 6
                  scopes:
                      - global
                      - store
                  settings:
                      - key: request_quote_event_enabled
                        name: Request Quote
                        description: 'The customer submits the quote request form and the new quote request opens; reloading its page and a form shown again with errors are not counted. GA4 event: request_quote.'
                        type: boolean
                        default_value: false
                        enabled: true
                        secret: false
                        storefront: true
                        order: 0
                        scopes:
                            - global
                            - store
                      - key: quote_submitted_event_enabled
                        name: Quote Submitted
                        description: 'The customer sends the quote request to the agent, from its details or edit page, and the shop accepts it; reloading the page and a send the shop refuses are not counted. GA4 event: quote_submitted.'
                        type: boolean
                        default_value: false
                        enabled: true
                        secret: false
                        storefront: true
                        order: 1
                        scopes:
                            - global
                            - store
                      - key: quote_approved_event_enabled
                        name: Quote Approved
                        description: 'Quote is approved. GA4 event: quote_approved.'
                        type: boolean
                        default_value: false
                        enabled: true
                        secret: false
                        storefront: true
                        order: 2
                        scopes:
                            - global
                            - store
                      - key: quote_approval_requested_event_enabled
                        name: Quote Approval Requested
                        description: 'Approval is requested for a cart. GA4 event: quote_approval_requested.'
                        type: boolean
                        default_value: false
                        enabled: true
                        secret: false
                        storefront: true
                        order: 3
                        scopes:
                            - global
                            - store
                      - key: quote_approval_granted_event_enabled
                        name: Quote Approval Granted
                        description: 'Approver grants the approval request. GA4 event: quote_approval_granted.'
                        type: boolean
                        default_value: false
                        enabled: true
                        secret: false
                        storefront: true
                        order: 4
                        scopes:
                            - global
                            - store
                      - key: quote_approval_rejected_event_enabled
                        name: Quote Approval Rejected
                        description: 'Approver rejects the approval request. GA4 event: quote_approval_rejected.'
                        type: boolean
                        default_value: false
                        enabled: true
                        secret: false
                        storefront: true
                        order: 5
                        scopes:
                            - global
                            - store
                - key: company_events
                  name: Company Events
                  description: Company context switch events.
                  section: event_tracking
                  toggle_all: true
                  layout: compact
                  enabled: true
                  order: 7
                  scopes:
                      - global
                      - store
                  settings:
                      - key: switch_company_account_event_enabled
                        name: Switch Company Account
                        description: 'Customer switches the company account. GA4 event: switch_company_account.'
                        type: boolean
                        default_value: false
                        enabled: true
                        secret: false
                        storefront: true
                        order: 0
                        scopes:
                            - global
                            - store
                      - key: switch_business_unit_event_enabled
                        name: Switch Business Unit
                        description: 'Customer switches the business unit. GA4 event: switch_business_unit.'
                        type: boolean
                        default_value: false
                        enabled: true
                        secret: false
                        storefront: true
                        order: 1
                        scopes:
                            - global
                            - store
