# yaml-language-server: $schema=../../../../Spryker/Configuration/resources/configuration/configuration-schema-v1.json
features:
    - key: integrations
      name: Integrations
      description: Third-party integrations configuration.
      enabled: true
      order: 100
      tabs:
          - key: google_analytics
            name: Google Analytics
            description: Google Analytics 4 integration settings. Used for search statistics.
            enabled: true
            order: 0
            sections:
                - key: event_tracking
                  name: Event Tracking
                  description: Storefront events sent to Google Analytics 4. A disabled event is not tracked.
            groups:
                - key: tracking
                  name: Storefront Tracking
                  description: Storefront tracking configuration for GA4 using gtag.js.
                  enabled: true
                  order: 0
                  scopes:
                      - global
                      - store
                  settings:
                      - key: measurement_id
                        name: Measurement ID
                        description: >
                            GA4 Measurement ID (format: G-XXXXXXXXXX) used by the Google tag on the storefront.
                            Documentation: https://support.google.com/analytics/answer/9539598
                        type: string
                        default_value: ''
                        placeholder: 'G-xxxxxxx'
                        enabled: true
                        secret: false
                        storefront: true
                        order: 1
                        scopes:
                            - global
                            - store
                        constraints:
                            - type: regex
                              message: 'Must be a valid key (starts with G- and has min 6 symbols after -).'
                              options:
                                  pattern: '^G-[A-Za-z0-9]{6,}$'
                - key: connection
                  name: Data API Connection
                  description: Connection settings for the Google Analytics Data API (GA4).
                  enabled: true
                  order: 1
                  scopes:
                      - global
                  settings:
                      - key: property_id
                        name: Property ID
                        description: >
                            GA4 numeric property ID (e.g. 123456789).
                            Documentation: https://developers.google.com/analytics/devguides/reporting/data/v1/property-id
                        type: string
                        default_value: ''
                        enabled: true
                        secret: false
                        storefront: false
                        order: 0
                        scopes:
                            - global
                      - key: service_account_credentials_json
                        name: Service Account Credentials JSON
                        description: >
                            Full JSON content of the Google Cloud service account key. Stored encrypted.
                            Documentation: https://docs.cloud.google.com/iam/docs/keys-create-delete
                        type: text
                        default_value: ''
                        enabled: true
                        secret: true
                        storefront: false
                        order: 1
                        scopes:
                            - global
                        constraints:
                            - type: 'SprykerEco\Zed\GoogleAnalytics\Communication\Constraint\GoogleAnalyticsCredentialsJsonFormatConstraint'
                - key: product_events
                  name: Product Events
                  description: Product discovery and interaction events.
                  section: event_tracking
                  toggle_all: true
                  layout: compact
                  enabled: true
                  order: 2
                  scopes:
                      - global
                      - store
                  settings:
                      - key: view_item_event_enabled
                        name: Product View
                        description: 'A product detail page is opened. GA4 event: view_item.'
                        type: boolean
                        default_value: false
                        enabled: true
                        secret: false
                        storefront: true
                        order: 6
                        scopes:
                            - global
                            - store
                      - key: view_item_list_event_enabled
                        name: Product List View
                        description: 'A category or search results page with products is shown. GA4 event: view_item_list.'
                        type: boolean
                        default_value: false
                        enabled: true
                        secret: false
                        storefront: true
                        order: 7
                        scopes:
                            - global
                            - store
                      - key: select_item_event_enabled
                        name: Product Click
                        description: 'A product is clicked in a category or search results list. GA4 event: select_item.'
                        type: boolean
                        default_value: false
                        enabled: true
                        secret: false
                        storefront: true
                        order: 8
                        scopes:
                            - global
                            - store
                      - key: add_to_wishlist_event_enabled
                        name: Add to Wishlist
                        description: 'A product is added to a wishlist on the product detail page. GA4 event: add_to_wishlist.'
                        type: boolean
                        default_value: false
                        enabled: true
                        secret: false
                        storefront: true
                        order: 9
                        scopes:
                            - global
                            - store
                      - key: search_event_enabled
                        name: Search
                        description: 'Storefront search is performed. GA4 events: search_results, zero_search_results.'
                        type: boolean
                        default_value: false
                        enabled: true
                        secret: false
                        storefront: true
                        order: 3
                        scopes:
                            - global
                            - store
                - key: cart_events
                  name: Cart Events
                  description: Product discovery and interaction events.
                  section: event_tracking
                  toggle_all: true
                  layout: compact
                  enabled: true
                  order: 2
                  scopes:
                      - global
                      - store
                  settings:
                      - key: add_to_cart_event_enabled
                        name: Add to Cart
                        description: 'A product is added to the cart, or a cart item quantity is raised. GA4 event: add_to_cart.'
                        type: boolean
                        default_value: false
                        enabled: true
                        secret: false
                        storefront: true
                        order: 4
                        scopes:
                            - global
                            - store
                      - key: remove_from_cart_event_enabled
                        name: Remove from Cart
                        description: 'A product is removed from the cart, or a cart item quantity is lowered. GA4 event: remove_from_cart.'
                        type: boolean
                        default_value: false
                        enabled: true
                        secret: false
                        storefront: true
                        order: 5
                        scopes:
                            - global
                            - store
                      - key: purchase_event_enabled
                        name: Purchase
                        description: 'An order is placed; reported once per order. GA4 event: purchase.'
                        type: boolean
                        default_value: false
                        enabled: true
                        secret: false
                        storefront: true
                        order: 10
                        scopes:
                            - global
                            - store
